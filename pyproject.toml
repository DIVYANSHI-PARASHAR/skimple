[project]
name = "skimple"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "redis>=5,<8",
  "rq>=2,<3",
  "boto3>=1.35,<2",
  "pillow>=11,<13",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "google-genai>=1,<2",
  "sentry-sdk[fastapi]>=2,<3",
  "pillow-heif>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependency declarations use calls as defaults.
